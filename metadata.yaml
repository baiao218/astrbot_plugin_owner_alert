name: astrbot_plugin_owner_alert
display_name: 管理员呼叫
short_desc: 她跟别人聊到「这事得找管理员」时，主动来找你——不等你想起来问
desc: |
  给对外会话装一个「升级阀门」。

  她对外人永远只有解释权，没有处置权。一旦对话走到她无权处理的地方，
  她会把这件事交给你，而不是自己硬撑，也不是把矛盾原样推回给对方。

  **两条触发路径**

  1. **她自己叫** —— 注册 `notify_owner` 工具，人格里教她什么时候调用。
     这条路径的好处是「为什么上报」由她自己写，语义最准。
  2. **钩子兜底** —— 她给别人回完话，插件再扫一遍「对方原话 + 她的回复」。
     对方提到隐私 / 侵权 / 举报 / 报警，或者她提到管理员 / 越权 / 上报，
     就把最近几轮原文推到你的私聊。模型忘了调工具也没关系。

  两条路径互斥，同一轮只报一次；另有冷却与每日上限，不会刷屏。

  **提醒长什么样**

  ```
  【有人来找你 · 20:31】
  来自：不知火（1367107068）
  原因：对方提到「隐私、侵权」；她提到「管理员」

  —— 最近的对话 ——
  对方：能不能删掉聊天记录
  她：我这里没有删除权限……
  ```

  原文会一起带过去——只发一句「有人找你」是没法判断的。

  **隐私边界**

  - 上下文只存在 AstrBot 的 `data/plugin_data/` 下，不联网、不外传
  - 只缓存最近的原始对话，超过上限自动滚动丢弃
  - 上报只发给你自己配置的会话
help: |
  **命令（管理员）**

  - `/上报状态` —— 开关、提醒发往哪里、节流参数、本会话今日已报次数
  - `/上报测试` —— 立刻发一条测试提醒，验证链路是否通
  - `/上报清空` —— 清掉当前会话的上下文缓存

  **配置要点**

  - `owner_umo` 留空会自动用 `admins_id` 里的 QQ 号绑定的私聊，不用手写
  - `threshold` 默认 3：对方强信号与她的外包话术各自单独命中即可触发；
    调到 6 就变成「两边同时出现」才报，更安静
  - 想让她的语气里带一句「这件事我会报上去」，需要人格里同步写一句引导
